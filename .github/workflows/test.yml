name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  minutes-api:
    name: Meeting minutes API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest "fastapi>=0.115" "httpx>=0.27"
      - name: Run minutes tests
        run: python -m pytest tests -q
        env:
          PYTHONPATH: .
